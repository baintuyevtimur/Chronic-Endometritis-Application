# ВАЖНО: этот файл — ориентир-пример, а не готовый конфиг.
# На сервере уже работают другие приложения, поэтому не создавайте новый
# server-блок с теми же server_name. Вместо этого добавьте блоки location
# ниже в уже существующий server-блок для dev.sbamsr.irk.ru / 84.237.24.66.

server {
    listen 80;
    server_name dev.sbamsr.irk.ru 84.237.24.66;

    # Игнорируем иконку сайта (чтобы не спамить в логи)
    location = /favicon.ico { access_log off; log_not_found off; }

    # Статика приложения
    # Статика уже собрана в staticfiles/ — collectstatic запускать не нужно
    location /static/ {
        alias /var/www/Chronic-Endometritis-Application-main/staticfiles/;
    }

    # Все запросы к приложению передаём в Django через Gunicorn
    # ВАЖНО: location /chronic_endometritis_app — не / (не трогаем другие приложения)
    location /chronic_endometritis_app {
        include proxy_params;
        proxy_pass http://unix:/var/www/Chronic-Endometritis-Application-main/app.sock;
    }

    # Ограничение на размер тела запроса
    client_max_body_size 20M;
}